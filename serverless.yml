useDotenv: true

org: ${env:AWS_ORG}
service: MA25-cupify-spicy-sheriffs

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role: ${env:AWS_ROLE}
  environment:
    TOURNAMENTS_TABLE: tournaments
    TEAMS_TABLE: teams
    MATCHES_TABLE: matches

resources:
  Resources:
    TournamentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: tournaments
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: entity
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: entity
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
    TeamsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: teams
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tournamentId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: tournamentId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
    MatchesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: matches
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tournamentId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: tournamentId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE

functions:
  getTournaments:
    handler: src/functions/tournaments/getTournaments.handler
    events:
      - httpApi:
          path: /tournaments
          method: GET

  getTournament:
    handler: src/functions/tournaments/getTournament.handler
    events:
      - httpApi:
          path: /tournaments/{id}
          method: GET

  createTournament:
    handler: src/functions/tournaments/createTournament.handler
    events:
      - httpApi:
          path: /tournaments
          method: POST

  updateTournamentStatus:
    handler: src/functions/tournaments/updateTournamentStatus.handler
    events:
      - httpApi:
          path: /tournaments/{id}/status
          method: PATCH
