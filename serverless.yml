# "org" ensures this Service is used with the correct Serverless Framework Access Key.
useDotenv: true

org: aurelievaudan
service: MA25-cupify-spicy-sheriffs

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  iam:
    role: ${env:AWS_ROLE}


functions:
  hello:
    handler: handler.hello
    events:
      - httpApi:
          path: /
          method: get
